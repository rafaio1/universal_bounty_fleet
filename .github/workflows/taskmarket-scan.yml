name: Taskmarket read-only candidate scan

on:
  pull_request:
    paths:
      - app/intake/taskmarket_source.py
      - tests/test_taskmarket_source.py
      - .github/workflows/taskmarket-scan.yml
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing project dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate source adapter without network
        run: python -m pytest -q tests/test_taskmarket_source.py
      - name: Scan official Taskmarket feed and Base receipt
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m app.intake.taskmarket_source --output taskmarket-candidates.json
      - name: Keep bounded scan result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: taskmarket-candidates
          path: taskmarket-candidates.json
          if-no-files-found: ignore
          retention-days: 7
